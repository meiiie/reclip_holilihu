name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Build desktop app
        shell: powershell
        run: pyinstaller ReClip.spec --noconfirm --clean

      - name: Copy ffmpeg into dist
        shell: powershell
        run: |
          $ffmpeg = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw "ffmpeg or ffprobe not found" }
          Copy-Item $ffmpeg.FullName dist\ffmpeg.exe -Force
          Copy-Item $ffprobe.FullName dist\ffprobe.exe -Force

      - name: Build setup exe
        shell: powershell
        run: python create_installer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoLiLiHu-ReClip-Setup
          path: HoLiLiHu-ReClip-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HoLiLiHu-ReClip-Setup.exe
