name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Python smoke tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile Python files
        shell: powershell
        run: python -m py_compile app.py downloader.py mcp_server.py reclip_holilihu_cli.py history.py settings.py desktop.py

      - name: Smoke test Flask API
        shell: powershell
        run: python tests\smoke_app.py

      - name: Smoke test MCP server
        shell: powershell
        run: python tests\smoke_mcp.py

      - name: Smoke test CLI
        shell: powershell
        run: |
          reclip-holilihu print-mcp-config codex --source .
          reclip-holilihu doctor
