[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holilihu-reclip"
version = "0.1.1"
description = "HoLiLiHu ReClip video downloader with Codex MCP tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "HoLiLiHu" }
]
keywords = ["mcp", "codex", "yt-dlp", "video", "downloader"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "flask",
  "yt-dlp",
  "mcp"
]

[project.optional-dependencies]
desktop = [
  "pyinstaller",
  "pywebview",
  "pythonnet"
]
dev = [
  "build",
  "twine"
]

[project.scripts]
reclip-holilihu = "reclip_holilihu_cli:main"
holilihu-reclip = "reclip_holilihu_cli:main"

[project.urls]
Homepage = "https://github.com/meiiie/reclip_holilihu"
Repository = "https://github.com/meiiie/reclip_holilihu"
Issues = "https://github.com/meiiie/reclip_holilihu/issues"

[tool.setuptools]
py-modules = [
  "app",
  "downloader",
  "history",
  "mcp_server",
  "reclip_holilihu_cli",
  "settings"
]
